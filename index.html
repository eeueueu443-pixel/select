<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="custom-select">
        <select class="old-select">
            <option value="rus">Russian</option>
            <option value="eng">English</option>
            <option value="ger">German</option>
            <option value="fr">French</option>
            <option value="kor">Korean</option>
            <option value="jap">Japanese</option>
            <option value="ch">Chinese</option>
        </select>
        <div class="select">
            <div class="select__placeholder">
                <span class="select__label">choose language</span>
                <div class="select__arrow"><img src="./akar-icons_chevron-down.svg"></div>
            </div>
            <div class="select__options">
                <div class="select__option" data-value="rus">Russian</div>
                <div class="select__option" data-value="eng">English</div>
                <div class="select__option" data-value="ger">German</div>
                <div class="select__option" data-value="fr">French</div>
                <div class="select__option" data-value="kor">Korean</div>
                <div class="select__option" data-value="jap">Japanese</div>
                <div class="select__option" data-value="ch">Chinese</div>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
